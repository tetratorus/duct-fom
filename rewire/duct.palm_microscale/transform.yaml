id: duct.palm_microscale
version: 0.1.0
kind: transform
title: DUCT PALM-4U microscale urban climate (ucm-palm-prep + ucm-palm-sim)
description: >
  Translated from ucm-palm/proc_prep/descriptor.json and ucm-palm/proc_sim/descriptor.json. PALM-4U runs on NSCC
  (ucm-palm-sim declares only configuration nscc), so this transform is external. adapter.prepare() writes the
  buildings GeoJSON from Silver; adapter.collect() turns climatic-variables HDF5 (air_temperature,
  relative_humidity, wind_speed; t, z, y, x) into the Gold tables below.
upstream:
  repo: tetratorus/duct-fom (fork of cooling-singapore/duct-fom), path ucm-palm; model PALM-4U
  license: "MIT (duct-fom wrapper); GPL-3.0-or-later (PALM, ucm-palm/palm_csd/LICENSE)"
  commercial_use: review
  notes: "GPL-3.0 copyleft applies to PALM and the bundled palm_csd; using results is unaffected, redistributing modified binaries is."
runtime:
  type: external
  notes: >
    HPC (NSCC). 1) adapter.prepare(inputs, params, wd) writes parameters + buildings (landcover/vegetation GeoJSON
    passed via params). 2) Run ucm-palm-prep then ucm-palm-sim through SaaS Middleware RTI (configuration nscc; see
    tetratorus/saas-middleware rewire/). 3) adapter.collect(wd) -> Gold frames, published with spine's
    Write-Audit-Publish. Python 3.10.
inputs:
  - {name: buildings, source: "silver:buildings", columns: [building_id, geometry, height_m]}
  - {name: districts, source: "silver:districts", columns: [district_id, geometry]}
parameters:
  type: object
  properties:
    name: {type: string, default: spine}
    bounding_box: {type: object, description: "EPSG:4326 west/south/east/north; default = districts bounds"}
    landcover_geojson: {type: string, description: "path to DUCT landcover GeoJSON (landcover_type)"}
    vegetation_geojson: {type: string, description: "path to DUCT vegetation GeoJSON (vegetation_type)"}
    palm_prep_parameters: {type: object, description: "rest of UCMPALM.PrepParameters (resolution, grid_dim, dt_sim, dd_profile, ah_profile)"}
outputs:
  - name: palm_grid
    key: [cell_id]
    columns:
      - {name: cell_id, type: string, description: "r<row>c<col> = upstream HDF5 array indices; row 0 is the SOUTHERN edge (DUCT writes its HDF5 south-up)"}
      - {name: row, type: int}
      - {name: col, type: int}
      - {name: geometry, type: geometry, description: "cell polygon, EPSG:3414"}
  - name: palm_values
    key: [cell_id, variable, timestamp, level]
    columns:
      - {name: cell_id, type: string}
      - {name: variable, type: string, description: "upstream HDF5 dataset name, verbatim"}
      - {name: unit, type: string, description: "upstream HDF5 unit attr, verbatim"}
      - {name: timestamp, type: int, description: "upstream HDF5 timestamps attr, verbatim"}
      - {name: level, type: int, description: "z index (0 for 2D fields)"}
      - {name: height_m, type: float, nullable: true, unit: m, description: "upstream HDF5 heights attr for 3D fields; null for 2D fields"}
      - {name: value, type: float}
readiness:
  level: 4
  evidence:
    - "spine validate passes."
    - "rewire/tests: prepare() writes buildings GeoJSON from Silver; collect() reads a 4D HDF5 laid out as ucm-palm-sim add_hdf5_output writes it (processor.py L320-350) and output passes spine check_gold."
    - "Grid orientation: HDF5 row 0 = south (ucm-palm-sim copies PALM (y, x) netCDF arrays verbatim; PALM y runs south->north (ucm-palm-prep flip_up=True for its GeoTIFFs)); rewire/tests/test_grid_orientation.py writes a north/south-asymmetric field, burns it to a GeoTIFF with upstream's own export_as_tiff_4326(flip_up=True), extracted verbatim from ucm-palm/proc_prep/processor.py, and checks every Gold cell polygon samples its own value."
  gaps:
    - "PALM not run here (needs NSCC PBS, compiled PALM-4U; netCDF4/GDAL stack not installed)."
    - "Silver has no PALM landcover_type/vegetation_type, so those inputs are passed through, not derived."
    - "HDF5 timestamps semantics (seconds since start) taken from code, not from a real output file."
    - "spine has no gold-import command for external runs yet; collect() returns the frames only."
    - "height_m is declared nullable: true, but spine check_gold (sg-urban-spine 5da419f) treats every declared column as required, so a 2D field would fail the WAP audit until the spine honours nullable."
